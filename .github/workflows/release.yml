name: release

# release-please keeps a release PR open on main. Merging it creates the vX.Y.Z tag and a GitHub release; the jobs
# below then build that tag: desktop archives for every platform, and the multi-arch gateway image. MinVer reads the
# tag, so no version lives in the repo. See docs/versioning.md and docs/deployment.md.

on:
  push:
    branches: [main]

permissions: {}

env:
  IMAGE: ghcr.io/aprs-net/aprsmap

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  desktop:
    # Self-contained single-file builds; no .NET install needed on the user's machine. All targets cross-publish from
    # Linux. Archives are unsigned for now (code signing and notarization: scope F4.8); the installers are the next job.
    needs: [release-please, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, archive: zip }
          - { rid: win-arm64, archive: zip }
          - { rid: linux-x64, archive: tar.gz }
          - { rid: linux-arm64, archive: tar.gz }
          - { rid: osx-x64, archive: tar.gz }
          - { rid: osx-arm64, archive: tar.gz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          dotnet publish src/AprsMap.Desktop/AprsMap.Desktop.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o "publish/${{ matrix.rid }}"
          cp LICENSE LICENSING.md "publish/${{ matrix.rid }}/"
      - name: Archive
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          name="aprsmap-${TAG}-${{ matrix.rid }}"
          mkdir -p artifacts
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd "publish/${{ matrix.rid }}" && zip -qr "../../artifacts/${name}.zip" .)
          else
            tar -C "publish/${{ matrix.rid }}" -czf "artifacts/${name}.tar.gz" .
          fi
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

  sbom:
    # Software bills of materials (docs/features/F4.17-sbom.md): CycloneDX JSON for the desktop app, the gateway and the
    # browser app, from the same restore the build uses, checked, then attached to the release beside the files they
    # describe. The image's own is made in the container job, from the image.
    needs: [release-please, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: tools/sbom.sh "${TAG#v}" sbom
      - run: python3 tools/ci/check-sbom.py sbom/*.cdx.json
      - name: Attach to the GitHub release
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

  installers:
    # Velopack installers and update packages (docs/features/F4.15-updates.md, behavior 12), each on its own platform's
    # runner: an MSI that installs to Program Files on Windows, a .pkg on macOS and an AppImage on Linux, with full and
    # delta packages and the releases.<rid>.json feed an installed build updates from. Unsigned until a signing
    # provider is found (behavior 14).
    needs: [release-please, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Product identity
        # From build/Branding.props, so a rename (tools/rename-product.py) carries through to the installers.
        run: |
          props=$(dotnet msbuild src/AprsMap.Desktop/AprsMap.Desktop.csproj \
            -getProperty:ProductSlug -getProperty:ProductDisplayName -getProperty:Company -getProperty:ProductSourceUrl)
          {
            echo "SLUG=$(jq -r .Properties.ProductSlug <<< "$props")"
            echo "TITLE=$(jq -r .Properties.ProductDisplayName <<< "$props")"
            echo "AUTHORS=$(jq -r .Properties.Company <<< "$props")"
            echo "REPO_URL=$(jq -r .Properties.ProductSourceUrl <<< "$props")"
            echo "VERSION=${TAG#v}"
          } >> "$GITHUB_ENV"
      - name: Publish
        # A folder rather than one file, so the delta packages stay small.
        run: |
          dotnet publish src/AprsMap.Desktop/AprsMap.Desktop.csproj -c Release -r "$RID" --self-contained -o publish
          cp LICENSE LICENSING.md publish/
      - name: Fetch the previous release's packages
        # Deltas are made against it; the first release has none.
        run: |
          dotnet vpk download github --repoUrl "$REPO_URL" --channel "$RID" --pre --token "$GH_TOKEN" -o releases \
            || echo "No earlier release for $RID: full packages only."
      - name: Packing tools
        # mksquashfs builds the AppImage; zstd makes the delta packages.
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools zstd
          else
            command -v zstd > /dev/null || brew install zstd
          fi
      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          for size in 16 32 128 256; do
            sips -z $size $size build/branding/icon-256.png --out "icon.iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 128; do
            sips -z $((size * 2)) $((size * 2)) build/branding/icon-256.png \
              --out "icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
      - name: Pack
        run: |
          case "$RUNNER_OS" in
            Windows) extra=(--msi --instLocation PerMachine --noPortable -i build/branding/icon.ico -e "$SLUG.exe") ;;
            macOS) extra=(--noPortable -i icon.icns -e "$SLUG") ;;
            *) extra=(--categories "Network;HamRadio" -i build/branding/icon-256.png -e "$SLUG") ;;
          esac
          dotnet vpk pack -u "$SLUG" -v "$VERSION" -p publish -c "$RID" -r "$RID" --packTitle "$TITLE" \
            --packAuthors "$AUTHORS" -o releases "${extra[@]}"
      - name: Attach to the GitHub release
        # Only this version's packages, the feed and the installer: on Windows the per-machine MSI, not the per-user
        # Setup.exe.
        run: |
          shopt -s nullglob
          files=(releases/releases."$RID".json releases/"$SLUG-$VERSION-$RID"-*.nupkg)
          files+=(releases/*.msi releases/*.pkg releases/*.AppImage)
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  container:
    # The web app is Docker-first: one multi-arch image (linux/amd64, linux/arm64) holding the gateway and the browser
    # app, pushed to GitHub Container Registry. The Dockerfile cross-publishes, so no emulation is involved.
    needs: [release-please, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to attach the image marker (F4.15 behavior 4.3) and the image's SBOM
      packages: write
      id-token: write # the SBOM attestation's signature (F4.17)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Until 1.0 every release is an alpha: tag the exact version and a floating 'alpha'. 'latest' starts at 1.0.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=alpha
      - id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image marker (F4.15 behavior 4.3): a gateway's update check offers a release once this is attached, so it
      # never points at an image that isn't pushed yet. It holds the image's tags and digest.
      - name: Attach the image marker
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          marker="aprsmap-${TAG}-image.txt"
          { echo "$TAGS"; echo "digest: $DIGEST"; } > "$marker"
          gh release upload "$TAG" "$marker" --clobber --repo "$GITHUB_REPOSITORY"
      # The image's SBOM (F4.17 behavior 3): CycloneDX, with its OS packages as well as the apps', made from the pushed
      # image (its linux/amd64 variant: both are built from the same files), attested to the image in the registry,
      # and attached to the release. After the marker, so a problem here never holds back the update notice.
      - name: SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: aprsmap-${{ needs.release-please.outputs.tag_name }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM to the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: aprsmap-${{ needs.release-please.outputs.tag_name }}-image.cdx.json
          push-to-registry: true
      - name: Attach the image's SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "aprsmap-${TAG}-image.cdx.json" --clobber --repo "$GITHUB_REPOSITORY"
