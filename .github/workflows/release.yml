name: release

# release-please keeps a release PR open on main. Merging it creates the vX.Y.Z tag and a GitHub release; the jobs
# below then build that tag: desktop archives for every platform, and the multi-arch gateway image. MinVer reads the
# tag, so no version lives in the repo. See docs/versioning.md and docs/deployment.md.

on:
  push:
    branches: [main]

permissions: {}

env:
  IMAGE: ghcr.io/aprs-net/aprsmap

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  desktop:
    # Self-contained single-file builds; no .NET install needed on the user's machine. All targets cross-publish from
    # Linux. Archives are unsigned for now (installers, code signing and notarization: scope F4.8).
    needs: [release-please, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, archive: zip }
          - { rid: win-arm64, archive: zip }
          - { rid: linux-x64, archive: tar.gz }
          - { rid: linux-arm64, archive: tar.gz }
          - { rid: osx-x64, archive: tar.gz }
          - { rid: osx-arm64, archive: tar.gz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          dotnet publish src/AprsMap.Desktop/AprsMap.Desktop.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o "publish/${{ matrix.rid }}"
          cp LICENSE LICENSING.md "publish/${{ matrix.rid }}/"
      - name: Archive
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          name="aprsmap-${TAG}-${{ matrix.rid }}"
          mkdir -p artifacts
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd "publish/${{ matrix.rid }}" && zip -qr "../../artifacts/${name}.zip" .)
          else
            tar -C "publish/${{ matrix.rid }}" -czf "artifacts/${name}.tar.gz" .
          fi
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

  container:
    # The web app is Docker-first: one multi-arch image (linux/amd64, linux/arm64) holding the gateway and the browser
    # app, pushed to GitHub Container Registry. The Dockerfile cross-publishes, so no emulation is involved.
    needs: [release-please, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to attach the image marker (F4.15 behavior 4.3)
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Until 1.0 every release is an alpha: tag the exact version and a floating 'alpha'. 'latest' starts at 1.0.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=alpha
      - id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image marker (F4.15 behavior 4.3): a gateway's update check offers a release once this is attached, so it
      # never points at an image that isn't pushed yet. It holds the image's tags and digest.
      - name: Attach the image marker
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          marker="aprsmap-${TAG}-image.txt"
          { echo "$TAGS"; echo "digest: $DIGEST"; } > "$marker"
          gh release upload "$TAG" "$marker" --clobber --repo "$GITHUB_REPOSITORY"
