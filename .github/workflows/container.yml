name: container

# Builds the gateway image (including the browser app, which needs the wasm-tools workload) without pushing it, so a
# broken Dockerfile shows up on the pull request rather than at release time. It takes several minutes, so it runs only
# when something the image is built from changes: the app's sources, the Dockerfile, or the shared build files.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build/**"
      - "Dockerfile"
      - ".dockerignore"
      - "global.json"
      - "nuget.config"
      - "Directory.*"
      - ".editorconfig"
      - "BannedSymbols*.txt"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "src/**"
      - "build/**"
      - "Dockerfile"
      - ".dockerignore"
      - "global.json"
      - "nuget.config"
      - "Directory.*"
      - ".editorconfig"
      - "BannedSymbols*.txt"
      - ".github/workflows/container.yml"

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
