name: rename-check

# The product is meant to be renamable with one script run (docs/features/F0.7-rebranding.md). This renames a copy of
# the repository to a test name and builds and tests it, so a hard-coded name or a script that no longer copes shows up.
# It is a full build and test, so it runs weekly and only when the rename machinery itself changes.

on:
  schedule:
    - cron: "41 6 * * 3" # Wednesdays 06:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/rename-product.py"
      - "build/Branding.props"
      - ".github/workflows/rename-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      # Every form of the name goes to the test name; the brand is spelled zedMap in prose. The previous name,
      # aprsmap, stays where it's history: PreviousSlugs, the installers' package id, the changelog and the docs.
      - name: Rename to a test name
        run: python3 tools/rename-product.py ZedMap SkyTrack --apply --also zedMap=skyTrack
      - name: Only the migration list still names the old product
        run: |
          # The name is built from parts, or the rename would rewrite this check too.
          old="zed""map"
          left="$(grep -rIl -i -E "$old" --exclude-dir=.git . | grep -v '^./build/Branding.props$' || true)"
          # The installers' package id never changes (build/Branding.props), so the rename must have kept it.
          grep -q "<ProductPackageId>aprs""map</ProductPackageId>" build/Branding.props ||
            { echo "::error::The rename changed ProductPackageId"; exit 1; }
          if [ -n "$left" ]; then
            echo "::error::The rename left the old name in: $left"
            exit 1
          fi
      - run: dotnet build SkyTrack.slnx -c Release
      # A test that hangs fails within minutes and is named in the log, instead of the job running to its limit.
      - run: dotnet test SkyTrack.slnx -c Release --no-build --blame-hang --blame-hang-timeout 5m
