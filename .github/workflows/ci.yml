name: ci

# Always starts, so the ci-ok job below can be the required check on main, but the changes job skips the build, tests,
# SBOM and format check for changes that cannot affect them: docs, Markdown, licence and release bookkeeping.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base (a new branch, or history that was rewritten) everything runs.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            echo "No base to compare with: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$(git merge-base "$BASE" "$GITHUB_SHA")" "$GITHUB_SHA")"
          # The same set the old paths-ignore filter skipped.
          ignored='^(docs/|LICENSE[^/]*$|\.release-please-manifest\.json$|release-please-config\.json$)|\.md$'
          code="$(printf '%s\n' "$changed" | grep -v -E "$ignored" | grep -v '^$' || true)"
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs or release bookkeeping changed: skipping the build, tests, SBOM and format check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # Windows and macOS only: the coverage job below is the Linux build and test run, so Linux isn't built twice.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger GitHubActions

  coverage:
    # The Linux build and test run, with coverage. Coverage on one platform is enough. The gate covers the MIT engine (Contracts, Core, Client.Remote), where the
    # logic lives; UI and host projects are reported but not gated.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # only to push coverage badges to the badges branch on main
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Install socat
        # The serial TNC tests run over a pseudo-terminal pair from socat; without it they're skipped.
        run: sudo apt-get update -q && sudo apt-get install -y -q socat
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger GitHubActions --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;JsonSummary;Badges" \
            -assemblyfilters:"+AprsMap.Contracts;+AprsMap.Core;+AprsMap.Client.Remote;+AprsMap.Tiles"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage gate
        env:
          MIN_LINE: 85 # raise these when coverage improves; do not lower them to get a change through
          MIN_BRANCH: 80
        run: |
          jq -r '.summary | "line \(.linecoverage)%, branch \(.branchcoverage)%"' coverage/report/Summary.json
          jq -e ".summary.linecoverage >= $MIN_LINE" coverage/report/Summary.json > /dev/null \
            || { echo "::error::Line coverage is below $MIN_LINE%"; exit 1; }
          jq -e ".summary.branchcoverage >= $MIN_BRANCH" coverage/report/Summary.json > /dev/null \
            || { echo "::error::Branch coverage is below $MIN_BRANCH%"; exit 1; }
      - name: Publish coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          # Commit to the orphan badges branch only when a badge changed (the SVGs carry no timestamp).
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$url" badges > /dev/null; then
            git clone --quiet --depth 1 --branch badges "$url" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet --orphan badges
          fi
          cp coverage/report/badge_linecoverage.svg coverage/report/badge_branchcoverage.svg "$dir"/
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then
            echo "Coverage badges unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update coverage badges for ${GITHUB_SHA::7}"
          git push --quiet "$url" HEAD:badges

  sbom:
    # The release's SBOMs (docs/features/F4.17-sbom.md, behavior 5): made the way the release makes them, and checked,
    # so a change that breaks them shows here rather than on release day.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: tools/sbom.sh 0.0.0-ci sbom
      - run: python3 tools/ci/check-sbom.py sbom/*.cdx.json
      - name: About agrees with the SBOM
        # Help › About's list (F1.34) is written by the build from the same restore; each app's must match its SBOM.
        run: |
          for app in Desktop Gateway Browser; do
            dotnet build "src/AprsMap.$app/AprsMap.$app.csproj" -c Release -v quiet
          done
          python3 tools/ci/check-sbom.py --about src/AprsMap.Desktop/obj/Release/net10.0/components.json sbom/*-desktop.cdx.json
          python3 tools/ci/check-sbom.py --about src/AprsMap.Gateway/obj/Release/net10.0/components.json sbom/*-gateway.cdx.json
          python3 tools/ci/check-sbom.py --about src/AprsMap.Browser/obj/Release/net10.0-browser/components.json \
            sbom/*-browser.cdx.json

  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .

  ci-ok:
    # The one check to require on main: it passes when every job above passed, or was skipped for a docs-only change.
    if: always()
    needs: [changes, build, coverage, sbom, format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A CI job ended with '$result'."; exit 1 ;;
            esac
          done
