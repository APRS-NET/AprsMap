<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AprsMap web on a phone: map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-s{width:16px;height:16px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.muted{color:#5A6270}
.fab{width:44px;height:44px;border-radius:12px;border:1px solid #DCE0E6;background:#fff;color:#16191D;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,25,30,.15);cursor:pointer}
.stn{position:absolute;display:flex;align-items:center;gap:3px;transform:translate(-13px,-13px)}
.sym{width:26px;height:26px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid #1F5FAE;display:flex;align-items:center;justify-content:center;color:#1F5FAE;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sym.wx{border-color:#0F766E;color:#0F766E}
.sym.digi{border-color:#6D28D9;color:#6D28D9}
.sym.me{border-color:#C2410C;color:#C2410C}
.lbl{font:600 10.5px 'IBM Plex Mono',monospace;background:rgba(255,255,255,.94);padding:1px 4px;border-radius:4px;color:#16191D;white-space:nowrap}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;border:0;background:none;font:500 11px 'IBM Plex Sans',sans-serif;color:#4A515C;cursor:pointer;position:relative}
.tab.on{color:#1F5FAE}
.badge{position:absolute;top:6px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#B42318;color:#fff;font:600 10px/16px 'IBM Plex Sans',sans-serif;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font:500 13px 'IBM Plex Sans',sans-serif;border:1px solid #DCE0E6;background:#fff;color:#16191D;white-space:nowrap;cursor:pointer}
.chip.on{background:#E6EEF8;border-color:#9DB9DD;color:#174A88}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F2F5}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E8EDE4; font-family: 'IBM Plex Sans', sans-serif; color: #16191D; font-size: 14px">
<svg aria-hidden="true" style="display: none">
<symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></symbol>
<symbol id="i-term" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM7.5 9.5l3 2.5-3 2.5M12.5 15h4"></path></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5zM2 13l10 5 10-5"></path></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"></path></symbol>
<symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M4 15l1.6-4.8A2 2 0 0 1 7.5 8.8h9a2 2 0 0 1 1.9 1.4L20 15v3.5H4zM4 15h16M7 18.5V20M17 18.5V20"></path></symbol>
<symbol id="i-house" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4zM10 20v-5h4v5"></path></symbol>
<symbol id="i-tower" viewBox="0 0 24 24"><path d="M12 9v12M8.5 21 12 9l3.5 12M8 6.5a5.5 5.5 0 0 1 8 0M5.5 4a9 9 0 0 1 13 0"></path></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"></path></symbol>
<symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.6"></circle><path d="M10 21l2-6 3 3v3M8.5 12.5l2.5-5 3 2 2 3"></path></symbol>
<symbol id="i-signal" viewBox="0 0 24 24"><path d="M12 12v9M8.5 8.5a5 5 0 0 1 7 0M5.5 5.5a9.2 9.2 0 0 1 13 0"></path></symbol>
</svg>
<svg aria-hidden="true" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%">
<rect width="390" height="844" fill="#E8EDE4"></rect>
<path d="M20 560h110v90H20zM250 120h110v80H250z" fill="#D5E5CD"></path>
<path d="M-10 330C80 300 160 380 240 360S340 300 400 320" stroke="#C3D8EA" stroke-width="18" fill="none"></path>
<g stroke="#FFFFFF" stroke-width="4"><path d="M0 110H390M0 240H390M0 470H390M0 600H390M0 720H390M60 0V844M150 0V844M240 0V844M330 0V844"></path></g>
<path d="M0 700C120 660 170 520 210 440S300 300 390 200" stroke="#F4D696" stroke-width="7" fill="none"></path>
</svg>

<div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center">
<button style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid #DCE0E6; background: #fff; box-shadow: 0 2px 8px rgba(20,25,30,.15); font: 14px 'IBM Plex Sans', sans-serif; color: #5A6270; text-align: left; cursor: pointer"><svg class="ic ic-s"><use href="#i-search"></use></svg>Search stations…</button>
<button aria-label="Station N0CALL-9, transmit armed" style="height: 48px; padding: 0 10px; border-radius: 14px; border: 1px solid #F6C48C; background: #FFF7ED; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(20,25,30,.15); cursor: pointer"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1E7A4C"></span><span class="mono" style="font-weight: 600; font-size: 13px; color: #8A3B00">N0CALL-9</span></button>
</div>
<div style="position: absolute; left: 12px; top: 72px; display: flex; gap: 6px"><span class="chip on" style="height: 28px; font-size: 12px">RF + IS</span><span class="chip" style="height: 28px; font-size: 12px">2 h</span></div>

<div class="stn" style="left: 50%; top: 46%"><span class="sym me"><svg class="ic ic-s"><use href="#i-car"></use></svg></span><span class="lbl" style="color: #8A3B00">me</span></div>
<div class="stn" style="left: 30%; top: 30%"><span class="sym"><svg class="ic ic-s"><use href="#i-car"></use></svg></span><span class="lbl">KD0AAA-9</span></div>
<div class="stn" style="left: 68%; top: 34%"><span class="sym wx"><svg class="ic ic-s"><use href="#i-cloud"></use></svg></span><span class="lbl">W0AAB-13</span></div>
<div class="stn" style="left: 74%; top: 56%"><span class="sym digi"><svg class="ic ic-s"><use href="#i-tower"></use></svg></span><span class="lbl">K0AAC-10</span></div>
<div class="stn" style="left: 22%; top: 52%"><span class="sym"><svg class="ic ic-s"><use href="#i-walk"></use></svg></span><span class="lbl">N0AAF-7</span></div>
<div class="stn" style="left: 40%; top: 60%"><span class="sym"><svg class="ic ic-s"><use href="#i-house"></use></svg></span><span class="lbl">WA0AAD</span></div>

<div style="position: absolute; right: 12px; top: 120px; display: flex; flex-direction: column; gap: 8px">
<button class="fab" aria-label="Layers"><svg class="ic"><use href="#i-layers"></use></svg></button>
<button class="fab" aria-label="Filters"><svg class="ic"><use href="#i-filter"></use></svg></button>
<button class="fab" aria-label="Centre on me"><svg class="ic"><use href="#i-locate"></use></svg></button>
</div>
<button aria-label="Beacon now" style="position: absolute; right: 12px; bottom: 268px; width: 56px; height: 56px; border-radius: 16px; border: 0; background: #C2410C; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(194,65,12,.4); cursor: pointer"><svg class="ic"><use href="#i-signal"></use></svg></button>

<section aria-label="Nearby stations" style="position: absolute; left: 0; right: 0; bottom: 58px; height: 196px; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -4px 16px rgba(20,25,30,.12); padding: 8px 16px 0; box-sizing: border-box">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #C5CBD3; margin: 0 auto 10px"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 16px">82 stations nearby</h2><span class="muted" style="font-size: 12.5px">14 moving</span></div>
<div class="row" style="margin-top: 8px"><span class="sym"><svg class="ic ic-s"><use href="#i-walk"></use></svg></span><div style="flex: 1"><div class="mono" style="font-weight: 600">N0AAF-7</div><div class="muted" style="font-size: 12.5px">2.1 km SW · 40 s · RF direct</div></div></div>
<div class="row"><span class="sym"><svg class="ic ic-s"><use href="#i-car"></use></svg></span><div style="flex: 1"><div class="mono" style="font-weight: 600">KD0AAA-9</div><div class="muted" style="font-size: 12.5px">6.8 km NW · 42 mph · 9 s</div></div></div>
</section>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 58px; display: flex; background: #fff; border-top: 1px solid #E6E9EE">
<button class="tab on" aria-current="page"><svg class="ic"><use href="#i-map"></use></svg>Map</button>
<button class="tab"><svg class="ic"><use href="#i-chat"></use></svg>Messages<span class="badge">2</span></button>
<button class="tab"><svg class="ic"><use href="#i-list"></use></svg>Stations</button>
<button class="tab"><svg class="ic"><use href="#i-term"></use></svg>Packets</button>
<button class="tab"><svg class="ic"><use href="#i-menu"></use></svg>More</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
